query GetConversationQuery($id: ID!, $markAsRead: Boolean, $before: ID, $first: Int = 30) {
  conversation(id: $id, markAsRead: $markAsRead) {
    id
    updatedAt
    unreadMessages
    groups {
      id
      name
    }
    users {
      id
      name
      nickname
      avatarImageFile {
        id
        formats(category: "AVATAR") {
          name
          url
        }
      }
    }
    messages(filter: {before: $before, first: $first}) {
      id
      content
      insertedAt
      updatedAt
      files {
        id
        filename
        fileType
        filesize
        id
        formats(category: "PREVIEW") {
          name
          url
        }
      }
      user {
        id
        name
        nickname
        avatarImageFile {
          id
          formats(category: "AVATAR") {
            name
            url
          }
        }
      }
    }
  }
}

query AddMessageToConversationLocalCacheMutation($id: ID!)
@apollo_client_ios_localCacheMutation {
  conversation(id: $id, markAsRead: true) {
    id
    updatedAt
    unreadMessages
    groups {
      id
      name
    }
    users {
      id
      name
      nickname
      avatarImageFile {
        id
        formats(category: "AVATAR") {
          name
          url
        }
      }
    }
    messages(filter: {first: 30}) {
      id
      content
      insertedAt
      updatedAt
      files {
        id
        filename
        fileType
        filesize
        formats(category: "AVATAR") {
          name
          url
        }
      }
      user {
        id
        name
        nickname
        avatarImageFile {
          id
          formats(category: "AVATAR") {
            name
            url
          }
        }
      }
    }
  }
}
