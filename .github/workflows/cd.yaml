name: CD
on:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run unit tests
        run: |
          ./gradlew testProductionDebugUnitTest --stacktrace

  bump_version:
    name: Bump version
    needs:
      - test
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      commit_hash: ${{ steps.update_commit.outputs.commit_hash }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 20

      - name: Bump version
        run: |
          ./gradlew bumpBuildNumber

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        id: update_commit
        with:
          commit_message: "Bump version"

  build:
    runs-on: ubuntu-latest
    needs:
      - bump_version
    environment:
      name: staging

    steps:
      - name: Checking out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump_version.outputs.commit_hash || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}

        run: |
          echo -n $KEYSTORE | base64 --decode > keystore.jks

      - name: Build Release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew bundleProductionRelease --stacktrace

      - name: Get release file aab path
        id: releaseAab
        run: echo "aabfile=$(find app/build/outputs/bundle/productionRelease/*.aab)" >> $GITHUB_OUTPUT

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: Android Release Bundle - ${{ needs.bump_version.outputs.commit_hash || github.sha }}
          path: ${{ steps.releaseAab.outputs.aabfile }}
          retention-days: 60

      - name: Save service-account.json
        env:
          GCLOUD_SERVICES_JSON: ${{ secrets.GCLOUD_SERVICES_JSON }}
        run: printf '%s' "$GCLOUD_SERVICES_JSON" > service-account.json

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: net.einsa.schule.lotta.staging
          releaseFiles: ${{ steps.releaseAab.outputs.aabfile }}
          track: beta
          status: completed
