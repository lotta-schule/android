name: CD
on:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Use mock google-services.json
        run: cp app/ci/google-services.mock.json app/google-services.json

      - name: Run unit tests
        run: |
          ./gradlew testProductionDebugUnitTest --stacktrace

  bump_version:
    name: Bump version
    needs:
      - test
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      commit_hash: ${{ steps.update_commit.outputs.commit_hash }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 20

      - name: Bump version
        run: |
          ./gradlew bumpBuildNumber

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        id: update_commit
        with:
          commit_message: "Bump version"

  build:
    name: Build and upload (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs:
      - bump_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            flavor: production
            gradle_flavor: Production
            package_name: net.einsa.schule.lotta
            # Production app is still a draft in Play Console; switch to "completed" once it has been published
            release_status: draft
          - environment: staging
            flavor: staging
            gradle_flavor: Staging
            package_name: net.einsa.schule.lotta.staging
            # Staging app is still a draft in Play Console; switch to "completed" once it has been published
            release_status: draft
    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Checking out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump_version.outputs.commit_hash || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}

        run: |
          echo -n $KEYSTORE | base64 --decode > keystore.jks

      - name: Save google-services.json
        env:
          FIREBASE_SERVICES_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
        run: |
          mkdir -p "app/src/${{ matrix.flavor }}"
          if [[ "$(printf '%s' "$FIREBASE_SERVICES_JSON" | head -c 1)" == "{" ]]; then
            printf '%s' "$FIREBASE_SERVICES_JSON" > "app/src/${{ matrix.flavor }}/google-services.json"
          else
            printf '%s' "$FIREBASE_SERVICES_JSON" | base64 --decode > "app/src/${{ matrix.flavor }}/google-services.json"
          fi

      - name: Build Release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew bundle${{ matrix.gradle_flavor }}Release --stacktrace

      - name: Get release file aab path
        id: releaseAab
        run: echo "aabfile=$(find app/build/outputs/bundle/${{ matrix.flavor }}Release/*.aab)" >> $GITHUB_OUTPUT

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: Android Release Bundle (${{ matrix.environment }}) - ${{ needs.bump_version.outputs.commit_hash || github.sha }}
          path: ${{ steps.releaseAab.outputs.aabfile }}
          retention-days: 60

      - name: Save service-account.json
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ "$(printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | head -c 1)" == "{" ]]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > service-account.json
          else
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > service-account.json
          fi

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: ${{ matrix.package_name }}
          releaseFiles: ${{ steps.releaseAab.outputs.aabfile }}
          track: beta
          status: ${{ matrix.release_status }}
